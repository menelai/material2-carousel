<div
  #carouselContainer
  class="carousel"
  tabindex="0"
  [style.max-width]="maxWidth()"
  [style.height]="!maintainAspectRatio() ? '100%' : 'auto'"
>
  <ul
    #carouselList
    class="carousel-list"
    role="listbox"
    [style.transform]="translation()"
    [style.transition]="timings()"
    [style.flex-direction]="orientation() === 'rtl' ? 'row-reverse' : 'row'"
    [style.height]="!maintainAspectRatio() ? '100%' : 'auto'"
  >
    @for (slide of visibleSlides(); track slide) {
      <li
        #carouselSlide
        class="carousel-slide"
        role="option"
        [style.padding-bottom]="maintainAspectRatio() && proportion() ? proportion() + '%' : '0px'"
        [style.height]="!maintainAspectRatio() && slideHeight() ? slideHeight() : '0px'"
        (pointerdown)="onDragStart($event)"
        (pointermove)="onDrag($event, carouselSlide)"
        (pointerup)="onDragEnd($event, carouselSlide)"
        (pointercancel)="onDragEnd($event, carouselSlide)"
      >
        <ng-container [ngTemplateOutlet]="slide.templateRef()"></ng-container>
      </li>
    }
  </ul>

  @if (!hideArrows()) {
    <button
      mat-icon-button
      type="button"
      tabindex="-1"
      [color]="color()"
      [disabled]="!loop() && currentIndex() === 0"
      (click)="previous()"
    >
      @if (svgIconOverrides()?.arrowBack; as arrowBack) {
        <mat-icon [svgIcon]="arrowBack"></mat-icon>
      } @else {
        <mat-icon>arrow_back</mat-icon>
      }
    </button>
    <button
      mat-icon-button
      type="button"
      tabindex="-1"
      [color]="color()"
      [disabled]="!loop() && currentIndex() === visibleSlides().length - 1"
      (click)="next()"
    >
      @if (svgIconOverrides()?.arrowForward; as arrowForward) {
        <mat-icon [svgIcon]="arrowForward"></mat-icon>
      } @else {
        <mat-icon>arrow_forward</mat-icon>
      }
    </button>
  }

  @if (!hideIndicators()) {
    <div
      class="carousel-indicators"
      tabindex="-1"
      [style.flex-direction]="orientation() === 'rtl' ? 'row-reverse' : 'row'"
    >
      @for (slide of visibleSlides(); track slide; let i = $index) {
        <button
          type="button"
          tabindex="-1"
          mat-mini-fab
          [color]="color()"
          [disabled]="i === currentIndex()"
          (click)="slideTo(i)"
          (focus)="carouselContainer.focus()"
        ></button>
      }
    </div>
  }
</div>
